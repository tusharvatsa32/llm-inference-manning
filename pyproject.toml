[project]
name = "mini-inference"
version = "0.1.0"
description = "The educational inference engine built progressively across Building Fast and Reliable LLM Inference Systems (Manning)"
requires-python = ">=3.10"

[project.optional-dependencies]
chapter1 = [
	"torch>=2.2",
	"transformers>=4.45",
]
chapter2 = [
	"torch>=2.2",
	"transformers>=4.45",
]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
